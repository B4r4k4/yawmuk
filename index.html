<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2224" />
  <meta name="description" content="يومك — لعبة ثلاثية الأبعاد للتعرّف على الإسلام من مواقف الحياة اليومية في أمريكا | Yawmuk — a 3D game for discovering Islam through everyday life in America" />
  <title>يومك · Yawmuk</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    // restore the saved language before first paint (only the UI language is read; nothing is written)
    try { var p = JSON.parse(localStorage.getItem('yawmuk.progress.v1') || 'null'); var q = new URLSearchParams(location.search).get('lang'); var l = q || (p && p.lang); if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; } } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="3D scene"></canvas>
    <div id="ui" aria-live="polite"></div>
    <div id="fade" aria-hidden="true">
      <div class="veil">
        <span class="veil-star"></span>
        <div class="lbar indeterminate"><span id="veil-bar" class="lbar-fill"></span></div>
      </div>
    </div>
    <div id="loader" aria-busy="true">
      <div class="loader-inner">
        <div class="emblem spin" aria-hidden="true"><span class="emblem-star"></span><span class="emblem-star inner"></span><span class="emblem-dot"></span></div>
        <p class="loader-brand"><span class="title-ar" lang="ar">يومك</span><span class="title-en" lang="en">Yawmuk</span></p>
        <p id="loader-title" class="loader-title"></p>
        <div class="lbar indeterminate" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Loading"><span id="loader-bar" class="lbar-fill"></span></div>
        <p id="loader-label" class="loader-label" dir="auto"></p>
        <div class="loader-tip"><span id="loader-tip-label" class="tip-label"></span><p id="loader-tip" class="tip-text"></p></div>
      </div>
    </div>
  </div>
  <noscript>هذه اللعبة تحتاج إلى JavaScript. This game requires JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
